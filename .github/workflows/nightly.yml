name: Nightly

# release.yml counts only the runs of this title, so every run a dispatch narrowed must take another one.
run-name: ${{ (inputs.jobs || inputs.tests || (inputs.os && inputs.os != 'all')) && format('Nightly of chosen parts (jobs={0} tests={1} os={2})', inputs.jobs || 'all', inputs.tests || 'all', inputs.os || 'all') || 'Nightly, whole' }}

# With no inputs a dispatch runs every job whole. To prove one fix, name the jobs and, if wanted, the tests: gh workflow run nightly.yml --ref <branch> -f jobs=limits -f tests="test 251"
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Jobs to run, comma separated with no spaces: repeat, shuffle, properties, limits, environments, deadlines, sabotage. Empty runs every job.'
        type: string
        default: ''
      tests:
        description: 'Test ids to run, comma separated, such as test 251. Name the jobs that hold them too. Empty runs every test of the jobs.'
        type: string
        default: ''
      os:
        description: 'The system of the jobs that run on several: repeat and deadlines.'
        type: choice
        options: [all, ubuntu-latest, windows-latest, macos-latest]
        default: all

permissions:
  contents: read

# tests/run.ts narrows each of its runs to these tests. The inputs reach the steps only through the environment, never as text of a script.
env:
  LAWCHECK_ONLY: ${{ inputs.tests }}

# The network is open in environments, which starts official images and fetches packages, and in repeat and deadlines, which do not close it.
# A group that tests/harness/sets.ts declares empty has no job here; it gets one when it gets its first test.
# Every other job closes the network: a namespace with only a loopback device, as the runner's user with no supplementary group, and limits in a container run with --network none.
jobs:
  # A wrong job name or test id would otherwise skip or empty the jobs without a red.
  chosen:
    name: nightly chosen inputs
    if: ${{ inputs.jobs || inputs.tests || (inputs.os && inputs.os != 'all') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: The chosen jobs, tests and system exist and match
        env:
          LAWCHECK_JOBS: ${{ inputs.jobs }}
          LAWCHECK_OS: ${{ inputs.os }}
        run: node tests/harness/chosen.ts

  # The commit set on one commit, on each system: three times on Linux and macOS, where a test with mixed results is a flake and stops the release until it is fixed, and once on Windows.
  repeat:
    name: nightly commit set (${{ matrix.os }})
    if: ${{ !inputs.jobs || contains(format(',{0},', inputs.jobs), ',repeat,') }}
    runs-on: ${{ matrix.os }}
    # Three times the slowest green run of this job on each system in the last 16 green Nightlies, rounded up to 5 minutes.
    # Windows runs the set once: three times its slowest round in the green Nightlies of 2026-11-25, about 36 minutes.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 110 || matrix.os == 'macos-latest' && 160 || 95 }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((inputs.os && inputs.os != 'all') && format('["{0}"]', inputs.os) || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: The commit set
        run: npm test -- --repeat ${{ matrix.os == 'windows-latest' && 1 || 3 }}

  # The commit set in an order shuffled by a new seed, so a test that leans on another's leftovers fails. The runner takes the seed as LAWCHECK_ORDER_SEED and prints 'order seed <n>'; until tests/run.ts reads it, this job says declared empty.
  shuffle:
    name: nightly commit set in shuffled order
    if: ${{ !inputs.jobs || contains(format(',{0},', inputs.jobs), ',shuffle,') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: A new order seed
        id: seed
        run: |
          seed=$(od -An -N4 -tu4 /dev/urandom | tr -d ' ')
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "order seed $seed"
          echo "The commit set ran in the order of seed \`$seed\`; rerun with LAWCHECK_ORDER_SEED=$seed npm test" >> "$GITHUB_STEP_SUMMARY"
      - name: The commit set in shuffled order, with the network closed
        env:
          LAWCHECK_ORDER_SEED: ${{ steps.seed.outputs.seed }}
        run: |
          set -o pipefail
          if ! grep -q LAWCHECK_ORDER_SEED tests/run.ts; then
            echo "nightly commit set in shuffled order: declared empty  tests/run.ts does not read LAWCHECK_ORDER_SEED yet"
            exit 0
          fi
          sudo unshare --net -- sh -c 'ip link set lo up && u=$1 g=$2 && shift 2 && exec setpriv --reuid="$u" --regid="$g" --clear-groups env -i "$@"' \
              sh "$(id -u)" "$(id -g)" PATH="$PATH" HOME="$HOME" USER="$(id -un)" LOGNAME="$(id -un)" LAWCHECK_ORDER_SEED="$LAWCHECK_ORDER_SEED" LAWCHECK_ONLY="$LAWCHECK_ONLY" \
              npm test | tee "$RUNNER_TEMP/shuffle.log"
          if ! grep -qx "order seed $LAWCHECK_ORDER_SEED" "$RUNNER_TEMP/shuffle.log"; then
            echo "::error::tests/run.ts reads LAWCHECK_ORDER_SEED but did not print 'order seed $LAWCHECK_ORDER_SEED'"
            exit 1
          fi

  properties:
    name: nightly properties
    if: ${{ !inputs.jobs || contains(format(',{0},', inputs.jobs), ',properties,') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: A new seed
        id: seed
        run: |
          seed=$(od -An -N4 -tu4 /dev/urandom | tr -d ' ')
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "Properties ran with seed \`$seed\`; rerun with LAWCHECK_SEED=$seed node tests/run.ts nightly --group properties" >> "$GITHUB_STEP_SUMMARY"
      - name: The properties, with the network closed
        env:
          LAWCHECK_SEED: ${{ steps.seed.outputs.seed }}
        run: |
          sudo unshare --net -- sh -c 'ip link set lo up && u=$1 g=$2 && shift 2 && exec setpriv --reuid="$u" --regid="$g" --clear-groups env -i "$@"' \
            sh "$(id -u)" "$(id -g)" PATH="$PATH" HOME="$HOME" USER="$(id -un)" LOGNAME="$(id -un)" LAWCHECK_SEED="$LAWCHECK_SEED" LAWCHECK_ONLY="$LAWCHECK_ONLY" \
            node tests/run.ts nightly --group properties

  # The large limits under 1 GB of memory and no swap, test 248 under 2 GB, two processors, a full disk of 8 MB at /full and no network. The install and the build run before, on the runner, because the container has no network.
  limits:
    name: nightly limits
    if: ${{ !inputs.jobs || contains(format(',{0},', inputs.jobs), ',limits,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: About 6 GB free in the container's /tmp
        run: |
          set -o pipefail
          free=$(docker run --rm node:24 df -k --output=avail /tmp | tail -1 | tr -d ' ')
          if [ -z "$free" ] || ! [ "$free" -eq "$free" ] 2>/dev/null; then
            echo "::error::could not read the free space of the container's /tmp"
            exit 1
          fi
          echo "the container's /tmp has $((free / 1024 / 1024)) GB free"
          if [ "$free" -lt 6000000 ]; then
            echo "::error::the container's /tmp has $free kB free; the limits need about 6 GB"
            exit 1
          fi
      - name: The limits in a container of 1 GB, all but test 248
        timeout-minutes: 45
        run: |
          docker run --rm -e LAWCHECK_ONLY --network none -m 1g --memory-swap 1g --cpus 2 \
            --tmpfs /full:size=8m,mode=1777 -e LAWCHECK_FULL_DISK=/full \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/w" -w /w node:24 node tests/run.ts nightly --group limits --skip 'test 248'
      # Test 248 writes 150,000 files, and the runner's kernel charges their inodes and dentries on overlayfs, about 340 MiB, to the container, so 1 GB ended it for lack of memory on some nights.
      - name: Test 248 in a container of 2 GB
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          docker run --rm -e LAWCHECK_ONLY --network none -m 2g --memory-swap 2g --cpus 2 \
            --tmpfs /full:size=8m,mode=1777 -e LAWCHECK_FULL_DISK=/full \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/w" -w /w node:24 node tests/run.ts nightly --group limits 'test 248'

  # The install, git and ownership matrices start official images with Docker, and fetch packages, so this job has the network.
  environments:
    name: nightly environments
    if: ${{ !inputs.jobs || contains(format(',{0},', inputs.jobs), ',environments,') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node tests/run.ts nightly --group environments

  # The hook deadlines and the rule limit that the plugin and the tool ship, which per push run shorter, on each system: they end processes, which each system does its own way.
  deadlines:
    name: nightly shipped deadlines (${{ matrix.os }})
    if: ${{ !inputs.jobs || contains(format(',{0},', inputs.jobs), ',deadlines,') }}
    runs-on: ${{ matrix.os }}
    # Three times the slowest green run of this job on any system in the last 16 green Nightlies, rounded up to 5 minutes.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((inputs.os && inputs.os != 'all') && format('["{0}"]', inputs.os) || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node tests/run.ts nightly --group deadlines

  sabotage:
    name: nightly sabotage list
    if: ${{ !inputs.jobs || contains(format(',{0},', inputs.jobs), ',sabotage,') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: The sabotage list, with the network closed
        run: |
          sudo unshare --net -- sh -c 'ip link set lo up && u=$1 g=$2 && shift 2 && exec setpriv --reuid="$u" --regid="$g" --clear-groups env -i "$@"' \
            sh "$(id -u)" "$(id -g)" PATH="$PATH" HOME="$HOME" USER="$(id -un)" LOGNAME="$(id -un)" LAWCHECK_ONLY="$LAWCHECK_ONLY" node tests/run.ts nightly --group sabotage
