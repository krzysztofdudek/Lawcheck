name: Nightly

on:
  push:
    branches: [ci-layout]
  schedule:
    - cron: '17 2 * * *'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# The network is open only where the design names it: the install, git and ownership matrices (environments), the docs recipes that start images (docs) and, later, the corpus. Every other job closes it as the offline job of ci.yml does: a namespace with only a loopback device, as the runner's user with no supplementary group.
jobs:
  grammars:
    name: grammars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: .grammars
          key: grammars-${{ hashFiles('package-lock.json') }}
      - name: Grammars
        run: npm run grammars
      - uses: actions/upload-artifact@v7
        with:
          name: nightly-grammar-cache
          path: .grammars
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Three runs of the commit set on one commit, on each system: a test with mixed results is a flake, and a flake stops the release until it is fixed.
  repeat:
    name: nightly commit set three times (${{ matrix.os }})
    needs: grammars
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: nightly-grammar-cache
          path: .grammars
      - run: npm run build
      - name: The commit set, three times
        run: npm test -- --repeat 3

  # The commit set in an order shuffled by a new seed, so a test that leans on another's leftovers fails. The runner takes the seed as LAWCHECK_ORDER_SEED and prints 'order seed <n>'; until tests/run.ts reads it, this job says declared empty.
  shuffle:
    name: nightly commit set in shuffled order
    needs: grammars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: nightly-grammar-cache
          path: .grammars
      - run: npm run build
      - name: A new order seed
        id: seed
        run: |
          seed=$(od -An -N4 -tu4 /dev/urandom | tr -d ' ')
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "order seed $seed"
          echo "The commit set ran in the order of seed \`$seed\`; rerun with LAWCHECK_ORDER_SEED=$seed npm test" >> "$GITHUB_STEP_SUMMARY"
      - name: The commit set in shuffled order, with the network closed
        env:
          LAWCHECK_ORDER_SEED: ${{ steps.seed.outputs.seed }}
        run: |
          set -o pipefail
          if ! grep -q LAWCHECK_ORDER_SEED tests/run.ts; then
            echo "nightly commit set in shuffled order: declared empty  tests/run.ts does not read LAWCHECK_ORDER_SEED yet"
            exit 0
          fi
          sudo unshare --net -- sh -c 'ip link set lo up && u=$1 g=$2 && shift 2 && exec setpriv --reuid="$u" --regid="$g" --clear-groups env -i "$@"' \
              sh "$(id -u)" "$(id -g)" PATH="$PATH" HOME="$HOME" USER="$(id -un)" LOGNAME="$(id -un)" LAWCHECK_ORDER_SEED="$LAWCHECK_ORDER_SEED" \
              npm test | tee "$RUNNER_TEMP/shuffle.log"
          if ! grep -qx "order seed $LAWCHECK_ORDER_SEED" "$RUNNER_TEMP/shuffle.log"; then
            echo "::error::tests/run.ts reads LAWCHECK_ORDER_SEED but did not print 'order seed $LAWCHECK_ORDER_SEED'"
            exit 1
          fi

  properties:
    name: nightly properties
    needs: grammars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: nightly-grammar-cache
          path: .grammars
      - run: npm run build
      - name: A new seed
        id: seed
        run: |
          seed=$(od -An -N4 -tu4 /dev/urandom | tr -d ' ')
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "Properties ran with seed \`$seed\`; rerun with LAWCHECK_SEED=$seed node tests/run.ts nightly --group properties" >> "$GITHUB_STEP_SUMMARY"
      - name: The properties, with the network closed
        env:
          LAWCHECK_SEED: ${{ steps.seed.outputs.seed }}
        run: |
          sudo unshare --net -- sh -c 'ip link set lo up && u=$1 g=$2 && shift 2 && exec setpriv --reuid="$u" --regid="$g" --clear-groups env -i "$@"' \
            sh "$(id -u)" "$(id -g)" PATH="$PATH" HOME="$HOME" USER="$(id -un)" LOGNAME="$(id -un)" LAWCHECK_SEED="$LAWCHECK_SEED" \
            node tests/run.ts nightly --group properties

  security:
    name: nightly security
    needs: grammars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: nightly-grammar-cache
          path: .grammars
      - run: npm run build
      - name: The security tests, with the network closed
        run: |
          sudo unshare --net -- sh -c 'ip link set lo up && u=$1 g=$2 && shift 2 && exec setpriv --reuid="$u" --regid="$g" --clear-groups env -i "$@"' \
            sh "$(id -u)" "$(id -g)" PATH="$PATH" HOME="$HOME" USER="$(id -un)" LOGNAME="$(id -un)" node tests/run.ts nightly --group security

  # The large limits under 1 GB of memory and no swap, two processors, a full disk of 8 MB at /full and no network. The install and the build run before, on the runner, because the container has no network.
  limits:
    name: nightly limits
    needs: grammars
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: nightly-grammar-cache
          path: .grammars
      - run: npm run build
      - name: About 6 GB free in the container's /tmp
        run: |
          set -o pipefail
          free=$(docker run --rm node:24 df -k --output=avail /tmp | tail -1 | tr -d ' ')
          if [ -z "$free" ] || ! [ "$free" -eq "$free" ] 2>/dev/null; then
            echo "::error::could not read the free space of the container's /tmp"
            exit 1
          fi
          echo "the container's /tmp has $((free / 1024 / 1024)) GB free"
          if [ "$free" -lt 6000000 ]; then
            echo "::error::the container's /tmp has $free kB free; the limits need about 6 GB"
            exit 1
          fi
      - name: The limits in a container of 1 GB
        timeout-minutes: 45
        run: |
          docker run --rm --network none -m 1g --memory-swap 1g --cpus 2 \
            --tmpfs /full:size=8m,mode=1777 -e LAWCHECK_FULL_DISK=/full \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/w" -w /w node:24 node tests/run.ts nightly --group limits

  # The install, git and ownership matrices start official images with Docker, and fetch packages, so this job has the network.
  environments:
    name: nightly environments
    needs: grammars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: nightly-grammar-cache
          path: .grammars
      - run: npm run build
      - run: node tests/run.ts nightly --group environments

  docs:
    name: nightly docs recipes
    needs: grammars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: nightly-grammar-cache
          path: .grammars
      - run: npm run build
      - run: node tests/run.ts nightly --group docs

  sabotage:
    name: nightly sabotage list
    needs: grammars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: nightly-grammar-cache
          path: .grammars
      - run: npm run build
      - name: The sabotage list, with the network closed
        run: |
          sudo unshare --net -- sh -c 'ip link set lo up && u=$1 g=$2 && shift 2 && exec setpriv --reuid="$u" --regid="$g" --clear-groups env -i "$@"' \
            sh "$(id -u)" "$(id -g)" PATH="$PATH" HOME="$HOME" USER="$(id -un)" LOGNAME="$(id -un)" node tests/run.ts nightly --group sabotage

  # The whole corpus of real repositories with planted uses; it fetches them, so it has the network.
  corpus:
    name: nightly corpus
    needs: grammars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: nightly-grammar-cache
          path: .grammars
      - run: npm run build
      - run: node tests/run.ts nightly --group corpus

  # The lines of src/ that no test executed: a reading list for reviewers, not a threshold.
  coverage:
    name: nightly coverage list
    needs: grammars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: nightly-grammar-cache
          path: .grammars
      - run: npm run build
      - name: The coverage list, with the network closed
        run: |
          sudo unshare --net -- sh -c 'ip link set lo up && u=$1 g=$2 && shift 2 && exec setpriv --reuid="$u" --regid="$g" --clear-groups env -i "$@"' \
            sh "$(id -u)" "$(id -g)" PATH="$PATH" HOME="$HOME" USER="$(id -un)" LOGNAME="$(id -un)" node tests/run.ts nightly --group coverage

  # Every live result covers the paths it guards; the release runs this through the nightly set.
  live:
    name: nightly live results current
    needs: grammars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: nightly-grammar-cache
          path: .grammars
      - run: npm run build
      - name: The live results against their guarded paths, with the network closed
        run: |
          sudo unshare --net -- sh -c 'ip link set lo up && u=$1 g=$2 && shift 2 && exec setpriv --reuid="$u" --regid="$g" --clear-groups env -i "$@"' \
            sh "$(id -u)" "$(id -g)" PATH="$PATH" HOME="$HOME" USER="$(id -un)" LOGNAME="$(id -un)" node tests/run.ts nightly --group live
