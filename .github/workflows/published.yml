name: Published package

# Installs one version of lawcheck from the npm registry on each system and takes a new user's first steps with it. release.yml calls it after the publish; by hand it runs for any version on npm.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: 'The version on npm, such as 0.1.0-alpha.5'
        type: string
        required: true

permissions:
  contents: read

jobs:
  first-steps:
    name: lawcheck from npm, first steps (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The registry takes about a minute to show a new version, so an install that fails is tried again every 10 seconds, for up to 5 minutes. --prefer-online makes every try ask the registry: without it npm answers a later try from its cache of the first answer, which does not hold the version.
      - name: Install lawcheck from npm
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for i in $(seq 30); do
            if npm install --global --no-audit --no-fund --prefer-online "lawcheck@${VERSION}"; then
              exit 0
            fi
            echo "Install ${i} of 30 failed."
            if [ "${i}" -lt 30 ]; then
              sleep 10
            fi
          done
          echo "::error::npm did not install lawcheck@${VERSION} in 30 tries."
          exit 1
      # The script reads the quick start inside the installed package and needs nothing of the checkout but itself, so no npm ci runs here.
      - name: The version, the quick start page and its five steps
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: node tests/environments/published.ts "${VERSION}"
