name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The grammars and dist/ are built once, on Linux, and handed to the other jobs. A grammar built from source on Windows has other bytes than its pinned sha256, so Runes refuses that build there; the other jobs read this cache offline. dist/ built here is what the release packs, also on Linux.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: .grammars
          key: grammars-${{ hashFiles('package-lock.json', 'scripts/grammars.ts', 'scripts/grammar-licenses.txt') }}
      - name: Grammars
        run: npm run grammars
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: grammar-cache
          path: .grammars
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  # The per-push commit set of each system, in the shards of tests/harness/shards.json. Each shard records its events; the merge job of its system judges them as one run.
  shard:
    name: commit shard ${{ matrix.shard }}/${{ matrix.of }} (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: '24', system: linux, shard: 1, of: 3, offline: true }
          - { os: ubuntu-latest, node: '24', system: linux, shard: 2, of: 3, offline: true }
          - { os: ubuntu-latest, node: '24', system: linux, shard: 3, of: 3, offline: true }
          - { os: ubuntu-latest, node: '24.0.0', system: linux, shard: 1, of: 3 }
          - { os: ubuntu-latest, node: '24.0.0', system: linux, shard: 2, of: 3 }
          - { os: ubuntu-latest, node: '24.0.0', system: linux, shard: 3, of: 3 }
          - { os: ubuntu-latest, node: 'newest', system: linux, shard: 1, of: 3 }
          - { os: ubuntu-latest, node: 'newest', system: linux, shard: 2, of: 3 }
          - { os: ubuntu-latest, node: 'newest', system: linux, shard: 3, of: 3 }
          - { os: windows-latest, node: '24', system: win32, shard: 1, of: 8 }
          - { os: windows-latest, node: '24', system: win32, shard: 2, of: 8 }
          - { os: windows-latest, node: '24', system: win32, shard: 3, of: 8 }
          - { os: windows-latest, node: '24', system: win32, shard: 4, of: 8 }
          - { os: windows-latest, node: '24', system: win32, shard: 5, of: 8 }
          - { os: windows-latest, node: '24', system: win32, shard: 6, of: 8 }
          - { os: windows-latest, node: '24', system: win32, shard: 7, of: 8 }
          - { os: windows-latest, node: '24', system: win32, shard: 8, of: 8 }
          - { os: macos-latest, node: '24', system: darwin, shard: 1, of: 5 }
          - { os: macos-latest, node: '24', system: darwin, shard: 2, of: 5 }
          - { os: macos-latest, node: '24', system: darwin, shard: 3, of: 5 }
          - { os: macos-latest, node: '24', system: darwin, shard: 4, of: 5 }
          - { os: macos-latest, node: '24', system: darwin, shard: 5, of: 5 }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # '24' is the newest 24.x, '24.0.0' the oldest Node the package accepts (engines: >=24), and 'newest' the newest released Node: the range '*' leaves prereleases out, which 'latest' does not. check-latest asks for the newest even when the runner caches an older one.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node == 'newest' && '*' || matrix.node }}
          check-latest: ${{ matrix.node != '24.0.0' }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: grammar-cache
          path: .grammars
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # Through npm, so the tests that pack the tarball start npm by its own script on every system.
      - name: Shard ${{ matrix.shard }} of ${{ matrix.of }}
        if: ${{ !matrix.offline }}
        env:
          LAWCHECK_RECORD: ${{ runner.temp }}/shard
        run: npm run test:shard -- ${{ matrix.shard }}/${{ matrix.of }}
      # In a network namespace that holds only a loopback device, as the runner's user with no supplementary group (so not the docker group, whose socket reaches the network), so a test that reaches the network outside the suites named for it fails here.
      - name: Shard ${{ matrix.shard }} of ${{ matrix.of }}, with the network closed
        if: ${{ matrix.offline }}
        env:
          LAWCHECK_RECORD: ${{ runner.temp }}/shard
        run: |
          sudo unshare --net -- sh -c 'ip link set lo up && u=$1 g=$2 && shift 2 && exec setpriv --reuid="$u" --regid="$g" --clear-groups env -i "$@"' \
            sh "$(id -u)" "$(id -g)" PATH="$PATH" HOME="$HOME" USER="$(id -un)" LOGNAME="$(id -un)" LAWCHECK_RECORD="$LAWCHECK_RECORD" npm run test:shard -- ${{ matrix.shard }}/${{ matrix.of }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shard-${{ matrix.os }}-${{ matrix.node }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard
          if-no-files-found: error
          retention-days: 3

  # One system's shards judged as one run: every shard reported, the files they ran are the per-push set of the system each once, and the reporter judges the merged events as it judges a whole run.
  merge:
    name: commit ${{ matrix.system }} (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: shard
    if: always()
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: '24', system: linux }
          - { os: ubuntu-latest, node: '24.0.0', system: linux }
          - { os: ubuntu-latest, node: 'newest', system: linux }
          - { os: windows-latest, node: '24', system: win32 }
          - { os: macos-latest, node: '24', system: darwin }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node == 'newest' && '*' || matrix.node }}
          check-latest: ${{ matrix.node != '24.0.0' }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: shard-${{ matrix.os }}-${{ matrix.node }}-*
          path: shards
          merge-multiple: true
      - name: The shards as one run
        run: node tests/harness/merge.ts shards

  # Lawcheck on two public repositories pinned at full commits (tests/real), held to the committed expected results. Each repository is fetched by its commit alone.
  real:
    name: real repositories
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: grammar-cache
          path: .grammars
      - name: Two real repositories
        run: npm run real

  # Pinned, so a new Claude Code release cannot change what passes here. The validation needs no sign-in.
  plugin:
    name: plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.322
      - name: Marketplace manifest
        run: claude plugin validate .
      - name: Plugin manifest
        run: claude plugin validate ./plugin

  workflows:
    name: workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  # The one required check: green only when every job above is green; a cancelled, skipped or missing job is red.
  commit-set:
    name: commit set
    needs: [build, shard, merge, real, plugin, workflows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job green
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success")' > /dev/null; then
            echo "commit set: PASS  every job is green"
          else
            echo "commit set: FAIL  a job is not green: $(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | "\(.key) \(.value.result)"] | join(", ")')"
            exit 1
          fi
