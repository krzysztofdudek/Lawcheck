name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # dist/ is built once, on Linux, and handed to the other jobs; the build copies the grammars from the installed Runes package, which checks each against its pinned sha256. dist/ built here is what the release packs, also on Linux.
  build:
    name: build
    runs-on: ubuntu-latest
    outputs:
      shards_linux: ${{ steps.matrix.outputs.shards_linux }}
      shards_win32: ${{ steps.matrix.outputs.shards_win32 }}
      shards_darwin: ${{ steps.matrix.outputs.shards_darwin }}
      runs_linux: ${{ steps.matrix.outputs.runs_linux }}
      runs_win32: ${{ steps.matrix.outputs.runs_win32 }}
      runs_darwin: ${{ steps.matrix.outputs.runs_darwin }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # The runs of each system per push; tests/harness/shards.json gives each its shards, so a new plan changes no line here.
      - name: The shards of each system
        id: matrix
        env:
          RUNS: >-
            [{"os": "ubuntu-latest", "node": "24", "system": "linux", "offline": true},
            {"os": "ubuntu-latest", "node": "24.0.0", "system": "linux"},
            {"os": "ubuntu-latest", "node": "newest", "system": "linux"},
            {"os": "windows-latest", "node": "24", "system": "win32"},
            {"os": "macos-latest", "node": "24", "system": "darwin"}]
        run: |
          set -o pipefail
          node tests/harness/shards.ts matrix "$RUNS" | tee -a "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  # The per-push commit set of each system, in the shards of tests/harness/shards.json, one job per system so that each system's merge waits for its own shards only. Each shard records its events.
  shard-linux:
    name: commit shard ${{ matrix.shard }}/${{ matrix.of }} (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build.outputs.shards_linux) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # '24' is the newest 24.x, '24.0.0' the oldest Node the package accepts (engines: >=24), and 'newest' the newest released Node: the range '*' leaves prereleases out, which 'latest' does not. check-latest asks for the newest even when the runner caches an older one.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node == 'newest' && '*' || matrix.node }}
          check-latest: ${{ matrix.node != '24.0.0' }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # Through npm, so the tests that pack the tarball start npm by its own script on every system.
      - name: Shard ${{ matrix.shard }} of ${{ matrix.of }}
        if: ${{ !matrix.offline }}
        env:
          LAWCHECK_RECORD: ${{ runner.temp }}/shard
        run: npm run test:shard -- ${{ matrix.shard }}/${{ matrix.of }}
      # In a network namespace that holds only a loopback device, as the runner's user with no supplementary group (so not the docker group, whose socket reaches the network), so a test that reaches the network outside the suites named for it fails here.
      - name: Shard ${{ matrix.shard }} of ${{ matrix.of }}, with the network closed
        if: ${{ matrix.offline }}
        env:
          LAWCHECK_RECORD: ${{ runner.temp }}/shard
        run: |
          sudo unshare --net -- sh -c 'ip link set lo up && u=$1 g=$2 && shift 2 && exec setpriv --reuid="$u" --regid="$g" --clear-groups env -i "$@"' \
            sh "$(id -u)" "$(id -g)" PATH="$PATH" HOME="$HOME" USER="$(id -un)" LOGNAME="$(id -un)" LAWCHECK_RECORD="$LAWCHECK_RECORD" npm run test:shard -- ${{ matrix.shard }}/${{ matrix.of }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shard-${{ matrix.os }}-${{ matrix.node }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard
          if-no-files-found: error
          retention-days: 3

  shard-win32:
    name: commit shard ${{ matrix.shard }}/${{ matrix.of }} (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build.outputs.shards_win32) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node == 'newest' && '*' || matrix.node }}
          check-latest: ${{ matrix.node != '24.0.0' }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Shard ${{ matrix.shard }} of ${{ matrix.of }}
        env:
          LAWCHECK_RECORD: ${{ runner.temp }}/shard
        run: npm run test:shard -- ${{ matrix.shard }}/${{ matrix.of }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shard-${{ matrix.os }}-${{ matrix.node }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard
          if-no-files-found: error
          retention-days: 3

  shard-darwin:
    name: commit shard ${{ matrix.shard }}/${{ matrix.of }} (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build.outputs.shards_darwin) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node == 'newest' && '*' || matrix.node }}
          check-latest: ${{ matrix.node != '24.0.0' }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Shard ${{ matrix.shard }} of ${{ matrix.of }}
        env:
          LAWCHECK_RECORD: ${{ runner.temp }}/shard
        run: npm run test:shard -- ${{ matrix.shard }}/${{ matrix.of }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shard-${{ matrix.os }}-${{ matrix.node }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard
          if-no-files-found: error
          retention-days: 3

  # One system's shards judged as one run: every shard reported, the files they ran are the per-push set of the system each once, and the reporter judges the merged events as it judges a whole run. The merge reads only the recordings, so it runs on Linux for every system, without npm ci.
  merge-linux:
    name: commit ${{ matrix.system }} (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: [build, shard-linux]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build.outputs.runs_linux) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: shard-${{ matrix.os }}-${{ matrix.node }}-*
          path: shards
          merge-multiple: true
      # The merge reports the time from the start of the run to its verdict, which no job's own clock knows, so the start comes from the run.
      - name: The start of the run
        id: started
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at) || started=
          echo "at=$started" >> "$GITHUB_OUTPUT"
      - name: The shards as one run
        run: node tests/harness/merge.ts shards --system ${{ matrix.system }} --run-started "${{ steps.started.outputs.at }}" --profile "${{ runner.temp }}/profile.json" --summary "$GITHUB_STEP_SUMMARY"
      # Every test's file and time on this system, and what each file took in its shard, for the shard plan (node tests/harness/shards.ts plan --measured) and for finding where the seconds go.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: profile-${{ matrix.os }}-${{ matrix.node }}
          path: ${{ runner.temp }}/profile.json
          if-no-files-found: warn
          retention-days: 30

  merge-win32:
    name: commit ${{ matrix.system }} (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: [build, shard-win32]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build.outputs.runs_win32) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: shard-${{ matrix.os }}-${{ matrix.node }}-*
          path: shards
          merge-multiple: true
      # The merge reports the time from the start of the run to its verdict, which no job's own clock knows, so the start comes from the run.
      - name: The start of the run
        id: started
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at) || started=
          echo "at=$started" >> "$GITHUB_OUTPUT"
      - name: The shards as one run
        run: node tests/harness/merge.ts shards --system ${{ matrix.system }} --run-started "${{ steps.started.outputs.at }}" --profile "${{ runner.temp }}/profile.json" --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: profile-${{ matrix.os }}-${{ matrix.node }}
          path: ${{ runner.temp }}/profile.json
          if-no-files-found: warn
          retention-days: 30

  merge-darwin:
    name: commit ${{ matrix.system }} (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: [build, shard-darwin]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build.outputs.runs_darwin) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: shard-${{ matrix.os }}-${{ matrix.node }}-*
          path: shards
          merge-multiple: true
      # The merge reports the time from the start of the run to its verdict, which no job's own clock knows, so the start comes from the run.
      - name: The start of the run
        id: started
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at) || started=
          echo "at=$started" >> "$GITHUB_OUTPUT"
      - name: The shards as one run
        run: node tests/harness/merge.ts shards --system ${{ matrix.system }} --run-started "${{ steps.started.outputs.at }}" --profile "${{ runner.temp }}/profile.json" --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: profile-${{ matrix.os }}-${{ matrix.node }}
          path: ${{ runner.temp }}/profile.json
          if-no-files-found: warn
          retention-days: 30

  # Lawcheck on two public repositories pinned at full commits (tests/real), held to the committed expected results. Each repository is fetched by its commit alone.
  real:
    name: real repositories
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Two real repositories
        run: npm run real

  # Pinned, so a new Claude Code release cannot change what passes here. The validation needs no sign-in.
  plugin:
    name: plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.322
      - name: Marketplace manifest
        run: claude plugin validate .
      - name: Plugin manifest
        run: claude plugin validate ./plugin

  workflows:
    name: workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  # The site of docs/ as docs.yml deploys it; VitePress fails the build on a dead internal link. Nothing deploys from here.
  docs-site:
    name: docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm --prefix site ci
      - run: npm --prefix site run build
      - name: Every page names the version
        run: |
          version="lawcheck $(jq -r .version package.json)"
          pages=$(find site/.vitepress/dist -name '*.html' | wc -l)
          missing=$(grep -rLF --include='*.html' "$version" site/.vitepress/dist || true)
          if [ "$pages" -eq 0 ] || [ -n "$missing" ]; then
            echo "docs site: FAIL  $pages pages built; without '$version':"
            echo "$missing"
            exit 1
          fi
          echo "docs site: PASS  all $pages pages name '$version'"

  # The one required check: green only when every job above is green; a cancelled, skipped or missing job is red.
  commit-set:
    name: commit set
    needs: [build, shard-linux, shard-win32, shard-darwin, merge-linux, merge-win32, merge-darwin, real, plugin, workflows, docs-site]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job green
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success")' > /dev/null; then
            echo "commit set: PASS  every job is green"
          else
            echo "commit set: FAIL  a job is not green: $(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | "\(.key) \(.value.result)"] | join(", ")')"
            exit 1
          fi
