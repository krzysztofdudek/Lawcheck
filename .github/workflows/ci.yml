name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The grammars are built once, on Linux, and handed to the other jobs. A grammar built from source on Windows has other bytes than its pinned sha256, so Runes refuses that build there; the other jobs read this cache offline, so a missing grammar fails instead of starting a source build.
  grammars:
    name: grammars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: .grammars
          key: grammars-${{ hashFiles('package-lock.json') }}
      - name: Grammars
        run: npm run grammars
      - uses: actions/upload-artifact@v7
        with:
          name: grammar-cache
          path: .grammars
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  commit:
    name: commit ${{ matrix.group }} (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: grammars
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['24']
        group: [core, inputs, environments]
        include:
          - { os: ubuntu-latest, node: newest, group: core }
          - { os: ubuntu-latest, node: newest, group: inputs }
          - { os: ubuntu-latest, node: newest, group: environments }
    steps:
      - uses: actions/checkout@v7
      # '24' is the newest 24.x and 'newest' the newest released Node: the range '*' leaves prereleases out, which 'latest' does not. check-latest asks for the newest even when the runner caches an older one.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node == 'newest' && '*' || matrix.node }}
          check-latest: true
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: grammar-cache
          path: .grammars
      # Through npm, so the tests that pack the tarball start npm by its own script on every system.
      - name: The commit set, group ${{ matrix.group }}
        run: npm test -- --group ${{ matrix.group }}

  # The oldest Node the package accepts (engines: >=24), so a use of an API newer than 24.0.0 fails here.
  floor:
    name: commit floor (ubuntu-latest, Node 24.0.0)
    needs: grammars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.0.0
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: grammar-cache
          path: .grammars
      - name: The commit set on Node 24.0.0
        run: npm test

  # The same commit set in a network namespace that holds only a loopback device, as the runner's user with no supplementary group (so not the docker group, whose socket reaches the network), so a test that reaches the network outside the suites named for it fails here.
  offline:
    name: commit offline (ubuntu-latest, Node 24)
    needs: grammars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: grammar-cache
          path: .grammars
      - name: The commit set with the network closed
        run: |
          sudo unshare --net -- sh -c 'ip link set lo up && u=$1 g=$2 && shift 2 && exec setpriv --reuid="$u" --regid="$g" --clear-groups env -i "$@"' \
            sh "$(id -u)" "$(id -g)" PATH="$PATH" HOME="$HOME" USER="$(id -un)" LOGNAME="$(id -un)" npm test

  # Red on base and the mutants of the changed lines, at the gate: tests/gate is declared empty in tests/harness/sets.ts until they land, and the full history is there for the merge base.
  gate:
    name: gate (ubuntu-latest, Node 24)
    needs: grammars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: grammar-cache
          path: .grammars
      - name: Red on base and mutants at the gate
        run: npm test -- --group gate

  # Lawcheck on two public repositories pinned at full commits (tests/real), held to the committed expected results. Each repository is fetched by its commit alone.
  real:
    name: real repositories
    needs: grammars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: grammar-cache
          path: .grammars
      - name: Two real repositories
        run: npm run real

  # Pinned, so a new Claude Code release cannot change what passes here. The validation needs no sign-in.
  plugin:
    name: plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.322
      - name: Marketplace manifest
        run: claude plugin validate .
      - name: Plugin manifest
        run: claude plugin validate ./plugin

  workflows:
    name: workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
