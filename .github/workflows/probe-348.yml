name: Probe 348
on:
  pull_request:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Costs of one start
        run: |
          for i in 1 2 3; do /usr/bin/time -p ps -A -o pid=,ppid=,pgid=,stat=,lstart= | wc -l; done
          for i in 1 2 3; do /usr/bin/time -p node -e "" ; done
          for i in 1 2 3; do /usr/bin/time -p git --version ; done
          for i in 1 2 3; do /usr/bin/time -p node dist/cli.js --version ; done
          sysctl -n hw.ncpu
      - name: The two tests alone, three rounds
        run: node tests/run.ts loop --repeat 3 tests/acceptance/plugin.test.ts tests/contract/docs-examples.test.ts
