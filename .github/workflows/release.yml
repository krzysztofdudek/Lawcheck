name: Release

# Publishes lawcheck when a vX.Y.Z tag is pushed. Nothing else publishes: no job here creates tags, and the owner pushes the tag.
# npm trusted publishing is configured on npmjs.com for this repository and this workflow file, release.yml, with no environment: the file keeps that name, and the jobs publish and alpha keep id-token: write and no environment. The trusted publisher also needs "Allow npm dist-tag" turned on, for the job alpha.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Two releases at once would each read and move the dist-tags, so the later one waits for the earlier. A run that waits is replaced, not queued, when a third tag is pushed behind it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The commit set at the tagged commit; a red job stops the publish.
  # ci.yml's merge jobs read the start of their run through the API, and a called workflow gets no permission its caller withholds.
  verify:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci.yml

  # The nightly set is not run again here: its tests draw new seeds and orders, so a run here would judge other cases than the runs that were seen green. The Nightly does not run by itself: it runs twice by hand on the tagged commit before a release, and both runs must be green. The tagged commit must already have two green dispatched runs of nightly.yml, and the tag is laid only after them.
  nightly:
    name: two green Nightlies on the tagged commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Two green dispatched runs of nightly.yml on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          # verify and pack build github.sha, which a re-run keeps; a tag moved since the push names another commit, and this run must not publish the old one.
          NAMED=$(gh api "repos/${REPO}/commits/refs/tags/${TAG}" --jq '.sha')
          if [ "${NAMED}" != "${COMMIT}" ]; then
            echo "::error::Tag ${TAG} now names commit ${NAMED}, and this run builds ${COMMIT}, the commit it was pushed at. Do not re-run this run; the push of the tag at ${NAMED} starts its own."
            exit 1
          fi
          RUNS=$(gh api "repos/${REPO}/actions/workflows/nightly.yml/runs?head_sha=${COMMIT}&per_page=100" \
            --jq '.workflow_runs[] | select(.event == "workflow_dispatch") | "\(.id) \(.event) \(.status) \(.conclusion // "none") \(.html_url)"')
          GREEN=$(awk '$3 == "completed" && $4 == "success" && !seen[$1]++ { print }' <<< "${RUNS}")
          if [ "$(grep -c . <<< "${GREEN}")" -lt 2 ]; then
            echo "::error::Tag ${TAG} names commit ${COMMIT}, which has fewer than two green Nightlies: fewer than two dispatched runs of nightly.yml on that commit ended in success. Dispatch it by hand twice (gh workflow run nightly.yml --ref <a branch whose head is ${COMMIT}>), wait until both are green, then re-run this release run."
            if [ -n "${RUNS}" ]; then
              echo "The runs of nightly.yml on ${COMMIT} (id, event, status, conclusion, address):"
              printf '%s\n' "${RUNS}"
            fi
            exit 1
          fi
          echo "Tag ${TAG} names commit ${COMMIT}; green Nightlies:"
          printf '%s\n' "${GREEN}"

  # Everything that runs code of the repository or of its dependencies happens here, with a read-only token and no id-token, so no install script can mint the publishing token.
  pack:
    name: pack
    needs: [verify, nightly]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      disttag: ${{ steps.version.outputs.disttag }}
      published: ${{ steps.npm-check.outputs.published }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Version and tag agree
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(jq -r '.version' package.json)
          if [ "${TAG}" != "v${VERSION}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${VERSION}. Bump package.json (and CHANGELOG.md) first, then tag v${VERSION}."
            exit 1
          fi
          for f in package-lock.json plugin/.claude-plugin/plugin.json; do
            if [ "$(jq -r '.version' "$f")" != "${VERSION}" ]; then
              echo "::error::$f does not say ${VERSION}."
              exit 1
            fi
          done
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # A prerelease X.Y.Z-<id>.N publishes under <id> when <id> starts with a letter (alpha, beta, rc), except that an alpha goes under latest (see the publish job); a numeric prerelease such as X.Y.Z-1 publishes under 'next', because npm refuses a dist-tag that parses as a version range. A stable X.Y.Z publishes under 'latest'.
          if [[ "${VERSION}" == *-* ]]; then
            PRE="${VERSION#*-}"
            PRE="${PRE%%.*}"
            if [[ "${PRE}" =~ ^[A-Za-z][A-Za-z0-9-]*$ ]]; then
              echo "disttag=${PRE}" >> "$GITHUB_OUTPUT"
            else
              echo "disttag=next" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "disttag=latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Check npm for an existing version
        id: npm-check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "lawcheck@${VERSION}" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Version ${VERSION} is already on npm. Skipping publish and the GitHub release."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      # Runs before the publish on purpose: npm publish cannot be taken back, and a version without its CHANGELOG section must never reach the registry.
      - name: Release notes from CHANGELOG
        if: steps.npm-check.outputs.published == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "${RUNNER_TEMP}/release"
          awk -v want="## [${VERSION}]" '
            /^## \[/ { if (found) exit; found = (index($0, want) == 1); next }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' > "${RUNNER_TEMP}/release/notes.md"
          if [ ! -s "${RUNNER_TEMP}/release/notes.md" ]; then
            echo "::error::CHANGELOG.md has no section for ${VERSION}. Add '## [${VERSION}] - <date>' before releasing."
            exit 1
          fi
          {
            printf '\n## Install\n\n'
            printf '```\n'
            printf 'npm install --global lawcheck@%s\n' "${VERSION}"
            printf '```\n'
          } >> "${RUNNER_TEMP}/release/notes.md"
      - uses: actions/setup-node@v7
        if: steps.npm-check.outputs.published == 'false'
        with:
          node-version: 24
      - run: npm ci
        if: steps.npm-check.outputs.published == 'false'
      # prepack fetches the grammars, checks each against its pinned sha256 and builds dist/.
      - name: Pack the tarball
        if: steps.npm-check.outputs.published == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm pack --pack-destination "${RUNNER_TEMP}/release"
          test -s "${RUNNER_TEMP}/release/lawcheck-${VERSION}.tgz"
      - uses: actions/upload-artifact@v7
        if: steps.npm-check.outputs.published == 'false'
        with:
          name: release
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 5

  # Publishes the packed tarball and runs nothing of the repository: no checkout, no install, and --ignore-scripts. The OIDC token this job can mint is the only publishing credential.
  publish:
    name: publish
    needs: pack
    if: needs.pack.outputs.published == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      # OIDC trusted publishing needs npm >= 11.5.1. Pinned, so a new npm release cannot change how a tag publishes.
      - name: Use OIDC-capable npm
        run: npm install --global --ignore-scripts npm@11.6.2
      # No NODE_AUTH_TOKEN: authentication is npm trusted publishing over OIDC (id-token: write above).
      # An alpha goes under latest, and the job alpha then adds the dist-tag alpha to that version. Under its own tag, the alpha would leave latest where it was.
      - name: Publish to npm
        env:
          VERSION: ${{ needs.pack.outputs.version }}
          DISTTAG: ${{ needs.pack.outputs.disttag }}
        run: |
          TAG="${DISTTAG}"
          if [ "${DISTTAG}" = alpha ]; then
            TAG=latest
          fi
          npm publish "./release/lawcheck-${VERSION}.tgz" --ignore-scripts --provenance --access public --tag "${TAG}"

  # latest names the newest alpha, and alpha stays a tag of its own. The publish sets latest to the alpha it publishes, and this job adds the dist-tag alpha to that version. npm runs dist-tag over OIDC from npm 11.21.0, and only when the trusted publisher of release.yml on npmjs.com has "Allow npm dist-tag" turned on. This job needs that setting to add alpha. A re-run of this job alone repeats only the move of alpha. The job also runs when the publish was skipped because npm already holds the version, so a re-run of all jobs after a good publish moves alpha too.
  alpha:
    name: npm alpha on the new alpha
    needs: [pack, publish]
    if: ${{ !cancelled() && needs.pack.result == 'success' && needs.pack.outputs.disttag == 'alpha' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Use npm that runs dist-tag over OIDC
        run: npm install --global --ignore-scripts npm@11.21.2
      # A re-run after a newer alpha must not move alpha back to this one.
      # The registry takes about a minute to show a write, so a read that names an older version, or that the registry fails to answer, is read again every 10 seconds, for up to 5 minutes. A newer version fails at once.
      # Versions are ordered as semver orders them: ~ in place of - makes sort -V rank X.Y.Z-alpha.N below X.Y.Z.
      - name: latest still names this version
        env:
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          set -euo pipefail
          newest() {
            for v in "$@"; do
              if [ -n "${v}" ]; then
                printf '%s %s\n' "${v//-/\~}" "${v}"
              fi
            done | sort -V -k1,1 | tail -n 1 | cut -d' ' -f2
          }
          LATEST=''
          for i in $(seq 30); do
            if TAGS=$(curl -fsS https://registry.npmjs.org/-/package/lawcheck/dist-tags); then
              LATEST=$(jq -r '.latest // ""' <<< "${TAGS}")
              if [ "${LATEST}" = "${VERSION}" ]; then
                exit 0
              fi
              if [ "$(newest "${LATEST}" "${VERSION}")" = "${LATEST}" ]; then
                break
              fi
            else
              echo "Read ${i} of 30: the registry gave no answer."
            fi
            if [ "${i}" -lt 30 ]; then
              sleep 10
            fi
          done
          if [ -z "${LATEST}" ]; then
            echo "::error::The registry gave no dist-tags of lawcheck in 30 reads, so it is not known that latest names ${VERSION}."
          else
            echo "::error::The dist-tag latest of lawcheck names ${LATEST}, and this run releases ${VERSION}; alpha moves to the version that latest names, so it stays where it is."
          fi
          exit 1
      - name: Move alpha to the new version
        env:
          VERSION: ${{ needs.pack.outputs.version }}
        run: npm dist-tag add "lawcheck@${VERSION}" alpha
      - name: alpha and latest name the new version
        env:
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          set -euo pipefail
          newest() {
            for v in "$@"; do
              if [ -n "${v}" ]; then
                printf '%s %s\n' "${v//-/\~}" "${v}"
              fi
            done | sort -V -k1,1 | tail -n 1 | cut -d' ' -f2
          }
          TAGS=''
          for i in $(seq 30); do
            if READ=$(curl -fsS https://registry.npmjs.org/-/package/lawcheck/dist-tags); then
              TAGS="${READ}"
              ALPHA=$(jq -r '.alpha // ""' <<< "${TAGS}")
              LATEST=$(jq -r '.latest // ""' <<< "${TAGS}")
              if [ "${ALPHA}" = "${VERSION}" ] && [ "${LATEST}" = "${VERSION}" ]; then
                echo "${TAGS}"
                exit 0
              fi
              if [ "$(newest "${ALPHA}" "${LATEST}" "${VERSION}")" != "${VERSION}" ]; then
                break
              fi
            else
              echo "Read ${i} of 30: the registry gave no answer."
            fi
            if [ "${i}" -lt 30 ]; then
              sleep 10
            fi
          done
          if [ -z "${TAGS}" ]; then
            echo "::error::The registry gave no dist-tags of lawcheck in 30 reads, so it is not known that alpha and latest name ${VERSION}."
            exit 1
          fi
          echo "${TAGS}"
          for tag in alpha latest; do
            SEEN=$(jq -r --arg tag "${tag}" '.[$tag] // "no version"' <<< "${TAGS}")
            if [ "${SEEN}" != "${VERSION}" ]; then
              echo "::error::The dist-tag ${tag} of lawcheck names ${SEEN}, not ${VERSION}."
              exit 1
            fi
          done

  github-release:
    name: GitHub release
    needs: [pack, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release/notes.md
          prerelease: ${{ contains(needs.pack.outputs.version, '-') }}
