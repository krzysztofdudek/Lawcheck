<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lawcheck hero</title>
<meta name="robots" content="noindex">
<style>
%%FONTS%%
:root {
  --ground: #0B0B0D; --surface: #16151A; --code: #0F0E11; --text: #E7DECB; --muted: #A39D8F; --quiet: #8C8678;
  --brand: #F8D794; --brand-dim: #C9A95F; --line: #211F1A; --line-lit: #332F26; --line-strong: #6F6658;
  --proof: #45D483; --fail: #E5675C; --str: #D9C79F; --model: #B9A6E8; --api: #8FB8E8;
  --sans: Inter, system-ui, sans-serif; --mono: 'JetBrains Mono', ui-monospace, monospace;
  --mono-size: clamp(12px, 1.3vw, 19px);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ground); color: var(--text); font-family: var(--sans); font-variant-ligatures: none; }
button { font: inherit; color: inherit; }

.hero { position: relative; height: 100vh; height: 100svh; min-height: 640px; display: flex; flex-direction: column; overflow: hidden; }
.embed .hero { height: 100vh; min-height: 0; }
.embed .site { position: absolute; top: 10px; right: 14px; z-index: 1; padding: 0; }
.embed .site > :not(.links), .embed .links a { display: none; }
.embed .scene { min-height: 0 !important; }
.seeking .ctl { visibility: hidden; }
.hero.measure { height: auto !important; min-height: 0 !important; }
.hero.measure .stage, .hero.measure .scene { flex: none !important; min-height: 0 !important; }
.site { display: flex; align-items: center; gap: 22px; padding: 16px 24px 8px; flex: none; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--brand); font-weight: 700; font-size: 19px; text-decoration: none; flex: none; }
.brand svg { width: 22px; height: 30px; }
.site .grow { flex: 1; }
.install { display: flex; align-items: center; border: 1px solid var(--line-lit); border-radius: 8px; background: var(--code); font-family: var(--mono); font-size: 13px; flex: none; min-width: 0; }
.install code { padding: 8px 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.install code::before { content: '$ '; color: var(--quiet); }
.install button { border: 0; border-left: 1px solid var(--line-lit); background: transparent; color: var(--brand); padding: 8px 12px; cursor: pointer; border-radius: 0 8px 8px 0; font-size: 13px; }
.links { display: flex; gap: 18px; flex: none; font-size: 14px; }
.links a, .ctl { color: var(--muted); text-decoration: none; border: 0; background: none; cursor: pointer; padding: 0; font-size: 14px; }
.links a:hover, .ctl:hover { color: var(--brand); }

.stage { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; padding: 4px 24px 24px; }
.flow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 14px; }
.flow span { border: 1px solid var(--line-lit); border-radius: 999px; padding: 5px 13px; font-size: clamp(12px, 1vw, 15px); color: var(--quiet); white-space: nowrap; }
.flow span.on { background: var(--brand); color: var(--ground); border-color: var(--brand); font-weight: 700; }
.flow span.on.bad { background: var(--fail); border-color: var(--fail); }
.flow span.on.model { background: var(--model); border-color: var(--model); }
.flow span.was { color: var(--brand-dim); border-color: var(--brand-dim); }
.flow i { color: var(--line-strong); font-style: normal; }
.caption { max-width: 1100px; text-align: center; font-size: clamp(24px, 2.9vw, 44px); font-weight: 800; line-height: 1.15; min-height: 1.3em; letter-spacing: -.015em; margin: 0 0 4px; }
.caption code { font-family: var(--mono); font-size: .82em; color: var(--brand); font-weight: 600; }
.scene { flex: 1; min-height: 0; width: 100%; max-width: 1120px; display: flex; flex-direction: column; align-items: stretch; justify-content: center; gap: 16px; }

.card { background: var(--code); border: 1px solid var(--line-lit); border-radius: 14px; padding: 18px 22px; }
.card .h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--quiet); margin-bottom: 10px; }
.card .h .f { font-family: var(--mono); text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--muted); }
.mono { font-family: var(--mono); font-size: var(--mono-size); line-height: 1.6; white-space: pre-wrap; }
.cmd::before { content: '$ '; color: var(--quiet); }
.dimt { color: var(--quiet); } .fail { color: var(--fail); } .pass { color: var(--proof); }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 12px; font-size: 13px; font-weight: 700; }
.chip.green { background: var(--proof); color: var(--ground); }
.foot { text-align: center; font-size: 13px; color: var(--quiet); }

.nums { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.num { border-radius: 16px; padding: 20px 24px; border: 1.5px solid; text-align: center; }
.num.bad { border-color: rgba(229, 103, 92, .6); background: rgba(229, 103, 92, .06); }
.num.good { border-color: rgba(69, 212, 131, .55); background: rgba(69, 212, 131, .05); }
.num .big { font-size: clamp(48px, 7vw, 108px); font-weight: 800; letter-spacing: -.03em; line-height: 1; }
.num.bad .big { color: var(--fail); } .num.good .big { color: var(--proof); }
.num .lbl { margin-top: 10px; font-size: clamp(15px, 1.35vw, 20px); line-height: 1.35; }
.num .src { text-align: left; background: var(--code); border-radius: 8px; padding: 8px 12px; margin-top: 14px; }

.who { display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
.who svg.mark { width: 74px; height: 100px; color: var(--brand); }
.who .name { font-size: clamp(30px, 3.6vw, 54px); font-weight: 800; color: var(--brand); letter-spacing: -.02em; }
.who .what { font-size: clamp(20px, 2.2vw, 32px); font-weight: 700; max-width: 900px; line-height: 1.25; }
.agents { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
.agents span { border: 1px solid var(--line-strong); border-radius: 999px; padding: 6px 16px; font-size: clamp(13px, 1.1vw, 16px); }
.agents b { font-weight: 500; color: var(--quiet); }

.types { display: grid; grid-template-columns: 1fr auto 1fr; gap: 18px; align-items: center; }
.group { border-radius: 16px; padding: 16px 18px; border: 2px solid; }
.group.core { border-color: var(--brand); background: rgba(248, 215, 148, .06); }
.group.api { border-color: var(--api); background: rgba(143, 184, 232, .06); }
.group .name { font-size: clamp(18px, 1.8vw, 26px); font-weight: 800; margin-bottom: 8px; }
.group.core .name { color: var(--brand); } .group.api .name { color: var(--api); }
.group .path { font-family: var(--mono); font-size: var(--mono-size); color: var(--muted); }
.group .file { font-family: var(--mono); font-size: var(--mono-size); color: var(--text); }
.arrows { display: flex; flex-direction: column; gap: 14px; align-items: center; font-weight: 700; font-size: clamp(14px, 1.2vw, 18px); }
.arrows .a { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.arrows .ok { color: var(--proof); } .arrows .no { color: var(--fail); }
.arrows .no .line { text-decoration: line-through; text-decoration-thickness: 3px; }
.y { color: var(--brand-dim); } .s { color: var(--str); } .p { color: var(--muted); }
.law .ln { display: grid; grid-template-columns: 2.2em minmax(0, 1fr); }
.law .ln .no { color: var(--line-strong); text-align: right; padding-right: .9em; }
.law .ln.lit { background: rgba(248, 215, 148, .10); }
.law .tag { font-family: var(--sans); font-size: .74em; font-weight: 700; margin-left: 1em; padding: 1px 9px; border-radius: 999px; background: var(--brand); color: var(--ground); white-space: nowrap; }
.law .tag.prose { background: var(--model); }
.lawsplit { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.5fr); gap: 18px; align-items: center; }
.lawsplit .stack { display: flex; flex-direction: column; gap: 12px; }
.lawsplit .law .mono { font-size: calc(var(--mono-size) * .86); }

.code .ln { display: grid; grid-template-columns: 2.4em minmax(0, 1fr); border-left: 3px solid transparent; padding-left: 4px; }
.code .ln .no { color: var(--line-strong); text-align: right; padding-right: 1em; }
.code .ln.err { background: rgba(229, 103, 92, .16); border-left-color: var(--fail); }
.code .ln.err .src { text-decoration: underline wavy var(--fail); text-decoration-skip-ink: none; text-underline-offset: 5px; }
.code .ln.ins { background: rgba(69, 212, 131, .13); border-left-color: var(--proof); }
.code .ln.gap .src { color: var(--line-strong); }
.k { color: var(--brand); } .t { color: #CFC4AC; } .fn { color: var(--brand-dim); }

.verdict { border-radius: 14px; padding: 14px 22px; border: 1.5px solid var(--fail); background: rgba(229, 103, 92, .06); }
.verdict.ok { border-color: var(--proof); background: rgba(69, 212, 131, .06); }
.verdict .head { font-family: var(--mono); font-size: clamp(18px, 1.8vw, 28px); font-weight: 700; margin-bottom: 4px; }
.verdict .row { font-family: var(--mono); font-size: var(--mono-size); line-height: 1.5; margin-top: 4px; }
.verdict .row b { color: var(--fail); }
.verdict .by { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; font-weight: 700; color: var(--brand); margin-bottom: 6px; }
.verdict .by svg { width: 14px; height: 19px; }

.flash { position: fixed; inset: 0; pointer-events: none; background: var(--fail); opacity: 0; }
.bots { display: flex; gap: 12px; flex-wrap: wrap; }
.bot-chip { display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--line-lit); border-radius: 999px; padding: 6px 16px 6px 8px; font-size: clamp(13px, 1.1vw, 16px); }
.bot-chip svg { width: 24px; height: 24px; color: var(--model); }
.bot-chip .bar { width: 60px; height: 4px; background: var(--line-lit); border-radius: 2px; overflow: hidden; }
.bot-chip .bar i { display: block; height: 100%; background: var(--model); }
.bot-chip.done { border-color: rgba(69, 212, 131, .5); }
.two { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; }
.prov { color: var(--model); font-weight: 700; }

.end { display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
.end .three { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.end .three span { border: 1px solid var(--line-strong); border-radius: 12px; padding: 12px 18px; font-size: clamp(14px, 1.3vw, 19px); }
.end .three b { color: var(--brand); }
.end .start { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; font-size: 15px; color: var(--muted); }
.end .start code { font-family: var(--mono); font-size: clamp(14px, 1.3vw, 19px); background: var(--code); border: 1px solid var(--brand); border-radius: 10px; padding: 8px 14px; color: var(--text); }
.end .start code::before { content: '$ '; color: var(--quiet); }

@media (max-width: 820px) {
  .links a { display: none; }
  .site { flex-wrap: wrap; padding: 14px 16px 8px; gap: 10px 14px; }
  .site .grow { display: none; }
  .links { margin-left: auto; }
  .install { order: 4; flex-basis: 100%; font-size: 12px; }
  .install code { flex: 1; }
  .stage { padding: 4px 12px 20px; }
  .hero { height: auto; min-height: 100svh; }
  .scene { min-height: 560px; justify-content: flex-start; }
  .nums, .two { grid-template-columns: 1fr; }
  .types, .lawsplit { grid-template-columns: 1fr; }
  .card { padding: 14px; }
  :root { --mono-size: 12px; }
}
.scene.mid { justify-content: center; }
.folders { display: grid; grid-template-columns: 1fr auto 1fr; gap: 20px; align-items: center; }
.folders .group { text-align: center; padding: 34px 20px; }
.folders .group .name { font-size: clamp(22px, 2.4vw, 36px); }
.ban { text-align: center; color: var(--fail); font-weight: 800; }
.ban .arrow { font-size: clamp(22px, 2.6vw, 40px); letter-spacing: -.1em; }
.ban .must { font-size: clamp(16px, 1.6vw, 24px); }
.why-tag { margin-left: 1.2em; font-family: var(--sans); font-weight: 700; font-size: .85em; color: var(--fail); white-space: nowrap; }
.code .ln { grid-template-columns: 2.4em auto 1fr; }
.del-line { background: rgba(229, 103, 92, .12); border-left: 3px solid var(--fail); padding: 6px 12px; text-decoration: line-through; text-decoration-color: rgba(229,103,92,.8); }
.ins-line { background: rgba(69, 212, 131, .13); border-left: 3px solid var(--proof); padding: 6px 12px; }
.flow span { font-size: clamp(13px, 1.15vw, 17px); padding: 6px 16px; }
@media (max-width: 820px) { .folders { grid-template-columns: 1fr; } .why-tag { display: block; margin-left: 0; } .code .ln { grid-template-columns: 2.4em 1fr; } }
.err-row { margin-top: 10px; }
.err-row .plain { font-size: clamp(18px, 1.8vw, 27px); font-weight: 800; color: var(--fail); }
.err-row .real { font-family: var(--mono); font-size: calc(var(--mono-size) * .82); color: var(--quiet); margin-top: 2px; }
.law .ln.off { opacity: .35; }
.prrow { display: flex; align-items: center; gap: 14px; border: 1px solid var(--line-lit); border-radius: 10px; padding: 12px 16px; background: var(--ground); margin-top: 10px; }
.prrow .mark-c { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; flex: none; color: var(--ground); }
.prrow .mark-c.no { background: var(--fail); } .prrow .mark-c.ok { background: var(--proof); }
.prrow .pt { font-weight: 700; font-size: clamp(15px, 1.3vw, 19px); }
.prrow .pd { font-size: calc(var(--mono-size) * .85); margin-top: 2px; }
.err-row .real2 { font-family: var(--mono); font-size: var(--mono-size); }
.err-row .real2 b { color: var(--fail); }
.err-row .gloss { display: inline-block; margin-left: .6em; font-weight: 800; font-size: clamp(14px, 1.25vw, 18px); color: var(--ground); background: var(--fail); border-radius: 999px; padding: 1px 12px; }
.ban .must { font-size: clamp(26px, 2.8vw, 42px); }
.steps3 { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; width: min(980px, 100%); text-align: left; }
.steps3 li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 4px 12px; align-items: center; background: var(--surface); border: 1px solid var(--line-lit); border-radius: 12px; padding: 10px 14px; }
.steps3 .n { grid-row: span 3; width: 30px; height: 30px; border-radius: 50%; background: var(--brand); color: var(--ground); font-weight: 800; display: grid; place-items: center; }
.steps3 span:not(.n) { font-weight: 700; font-size: clamp(15px, 1.3vw, 19px); }
.steps3 code { font-family: var(--mono); font-size: clamp(13px, 1.15vw, 17px); color: var(--text); }
.steps3 code::before { content: '$ '; color: var(--quiet); }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: stretch; }
.card .h.fname { text-transform: none; letter-spacing: 0; font-family: var(--mono); font-size: 14px; color: var(--muted); }
.notes { display: grid; grid-template-columns: max-content max-content; gap: 10px 16px; align-items: center; }
.notes .mono { font-size: clamp(14px, 1.35vw, 20px); white-space: pre; }
.note { justify-self: start; white-space: nowrap; font-weight: 700; font-size: clamp(12px, 1vw, 15px); padding: 3px 12px; border-radius: 999px; background: var(--brand); color: var(--ground); }
.outcome { display: flex; gap: 12px; align-items: flex-start; margin-top: 16px; padding: 12px 14px; border-radius: 10px; font-size: clamp(15px, 1.3vw, 19px); }
.outcome .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; margin-top: 6px; }
.outcome.quiet { background: var(--surface); color: var(--muted); } .outcome.quiet .dot { background: var(--line-strong); }
.outcome.loud { background: rgba(229, 103, 92, .12); border: 1.5px solid var(--fail); color: var(--text); } .outcome.loud .dot { background: var(--fail); }
.err-row { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 14px; align-items: center; margin-top: 12px; }
.err-row .gloss { margin-left: 0 !important; white-space: nowrap; }
.enforce { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.enforce span { white-space: nowrap; border: 1px solid var(--line-strong); border-radius: 12px; padding: 10px 16px; font-size: clamp(14px, 1.2vw, 18px); color: var(--muted); }
.enforce b { color: var(--brand); margin-right: 6px; }
@media (max-width: 820px) { .split { grid-template-columns: 1fr; } .err-row { grid-template-columns: 1fr; gap: 4px; } .enforce span { white-space: normal; } .notes { grid-template-columns: 1fr; gap: 4px; } }
.three-col { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: stretch; }
.three-col .txt { font-size: clamp(15px, 1.3vw, 19px); line-height: 1.4; }
.langs { display: flex; gap: 10px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
.langs span { font-family: var(--mono); font-size: clamp(13px, 1.15vw, 17px); color: var(--text); background: var(--ground); border: 1px solid var(--line-lit); border-radius: 8px; padding: 3px 10px; }
.langrow { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.langrow span { white-space: nowrap; border: 1px solid var(--line-strong); border-radius: 999px; padding: 4px 12px; font-size: clamp(12px, 1vw, 15px); color: var(--muted); }
@media (max-width: 820px) { .three-col { grid-template-columns: 1fr; } }
.err-row { grid-template-columns: 15.5em minmax(0, 1fr) !important; }
.err-row .gloss { justify-self: start; }
@media (max-width: 820px) { .err-row { grid-template-columns: 1fr !important; } }
</style>
</head>
<body>
<section class="hero" aria-label="What Lawcheck does">
  <header class="site">
    <a class="brand" href="/">%%MARK%%Lawcheck</a>
    <span class="grow"></span>
    <div class="install"><code id="cmd">npm install --global lawcheck@alpha</code><button type="button" id="copy">Copy</button></div>
    <nav class="links" aria-label="Lawcheck"><a href="https://docs.lawcheck.dev/">Docs</a><a href="https://github.com/krzysztofdudek/Lawcheck">GitHub</a><button class="ctl" type="button" id="pause" aria-label="Pause the animation" title="Pause the animation">❚❚</button></nav>
  </header>
  <div class="stage">
    <div class="flow" id="flow" aria-hidden="true"></div>
    <h1 class="caption" id="caption" aria-live="polite"></h1>
    <div class="scene" id="scene"></div>
  </div>
  <div class="flash" id="flash"></div>
</section>

<script>
const MARK = document.querySelector('.brand svg').outerHTML;
const ROBOT = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M12 3v3"/><circle cx="12" cy="2.6" r="1.2" fill="currentColor"/><rect x="4.5" y="6.5" width="15" height="11" rx="3.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="9.3" cy="12" r="1.5" fill="currentColor"/><circle cx="14.7" cy="12" r="1.5" fill="currentColor"/><path d="M8 20.5h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const typed = (text, p) => text.slice(0, Math.round(text.length * clamp(p)));
const show = (t, at, dur = 0.3) => `style="opacity:${ease((t - at) / dur).toFixed(3)};transform:translateY(${((1 - ease((t - at) / dur)) * 10).toFixed(1)}px)"`;

function yamlLine(line) {
  const m = /^(\s*)([\w-]+)(:)(.*)$/.exec(line);
  return m ? `${m[1]}<span class="y">${esc(m[2])}</span><span class="p">:</span><span class="s">${esc(m[4])}</span>` : esc(line);
}
const TOKEN = /("(?:[^"\\]|\\.)*")|\b(import|from|export|function|const|return|if|new)\b|\b(number|Date|Math)\b|([A-Za-z_$][\w$]*)(?=\s*\()|([{}()[\];,.:<>=|&!?+\-*/%]+)/g;
function tsLine(line) {
  let out = '', last = 0;
  line.replace(TOKEN, (m, str, kw, ty, fn, pun, at) => {
    out += esc(line.slice(last, at));
    out += `<span class="${str ? 's' : kw ? 'k' : ty ? 't' : fn ? 'fn' : 'p'}">${esc(m)}</span>`;
    last = at + m.length;
    return m;
  });
  return out + esc(line.slice(last));
}
function codeBlock(rows) {
  return `<div class="code mono">${rows.map(([no, text, cls]) => `<div class="ln ${cls}"><span class="no">${no || ''}</span><span class="src">${cls === 'gap' ? text : tsLine(text)}</span></div>`).join('')}</div>`;
}

const LAW = `lawcheck: 0.1.0

rules:
  no-clock:
    why: The core takes the time as an argument.
  clear-errors:
    why: An error a caller sees says what happened and what to do next.

types:
  api:
    paths: ["src/api/**"]
  core:
    paths: ["src/core/**"]
    may_use: [core]
    rules: [no-clock, clear-errors]`.split('\n');

const FLOW = ['edit', 'check', 'fix', 'pull request'];

const TAG = 'Lawcheck checks every edit your coding agent makes against your architecture rules.';
const SCENES = [
  { len: 2.6, flow: null, caption: '', mid: true, draw: (t) => `
    <div class="who">
      <div ${show(t, 0)}>${MARK.replace('<svg', '<svg class="mark"')}</div>

const STARTS = [];
let total = 0;
for (const s of SCENES) { STARTS.push(total); total += s.len; }
const LENGTH = total;

const $ = (id) => document.getElementById(id);
const last = {};
function put(id, html) { if (last[id] !== html) { last[id] = html; $(id).innerHTML = html; } }

let shown = 0;
function render(time) {
  shown = time;
  const t = ((time % LENGTH) + LENGTH) % LENGTH;
  let i = 0;
  STARTS.forEach((s, k) => { if (t >= s) i = k; });
  const local = t - STARTS[i];
  const sc = SCENES[i];
  const fadeOut = i === SCENES.length - 1 ? clamp((sc.len - local) / 0.5) : i === SCENES.length - 2 ? clamp((sc.len - local) / 0.35) : 1;
  const lit = sc.flow === null ? null : typeof sc.flow === 'function' ? sc.flow(local) : sc.flow;
  put('flow', FLOW.map((name, k) => `${k ? '<i>→</i>' : ''}<span class="${lit && lit.includes(k) ? `on ${sc.bad && k === 1 ? 'bad' : ''}` : ''}">${name}</span>`).join(''));
  $('flow').style.visibility = lit === null ? 'hidden' : 'visible';
  const cap = typeof sc.caption === 'function' ? sc.caption(local + 0.3) : sc.caption;
  put('caption', cap ? `<span>${cap}</span>` : '');
  $('caption').style.opacity = fadeOut.toFixed(3);
  put('scene', sc.draw(local + 0.3));
  $('scene').className = sc.mid ? 'scene mid' : 'scene';
  $('scene').style.opacity = fadeOut.toFixed(3);
  const f = i === 4 ? local + 0.3 - 1.0 : -1;
  $('flash').style.opacity = f >= 0 && f < 0.5 ? (f < 0.06 ? f / 0.06 * 0.22 : 0.22 * (1 - (f - 0.06) / 0.44)).toFixed(3) : '0';
}

let start = performance.now(), paused = false, pausedAt = 0, seeking = false;
function frame(now) {
  if (seeking || paused) return;
  render((now - start) / 1000);
  requestAnimationFrame(frame);
}
function button(playing) {
  const label = playing ? 'Pause the animation' : 'Play the animation';
  $('pause').textContent = playing ? '❚❚' : '▶';
  $('pause').setAttribute('aria-label', label);
  $('pause').title = label;
}
$('pause').addEventListener('click', () => {
  if (paused) { paused = false; start = performance.now() - pausedAt * 1000; button(true); requestAnimationFrame(frame); }
  else { paused = true; pausedAt = (performance.now() - start) / 1000; button(false); }
});
$('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText($('cmd').textContent); $('copy').textContent = 'Copied'; setTimeout(() => ($('copy').textContent = 'Copy'), 1600); } catch {}
});

window.heroSeek = (t) => { seeking = true; document.documentElement.classList.add('seeking'); render(Math.min(t, LENGTH - 0.001)); };
window.heroLength = LENGTH;

const query = new URLSearchParams(location.search);
const embedded = query.has('embed');
if (embedded) {
  document.documentElement.classList.add('embed');
  $('caption').removeAttribute('aria-live');
}

function tallest() {
  const hero = document.querySelector('.hero');
  hero.classList.add('measure');
  let most = 0;
  SCENES.forEach((scene, at) => {
    render(STARTS[at] + scene.len - 0.6);
    most = Math.max(most, hero.scrollHeight);
  });
  hero.classList.remove('measure');
  return most;
}

function tell() {
  if (!embedded || parent === window) return;
  const now = shown;
  const most = tallest();
  render(seeking || paused ? now : (performance.now() - start) / 1000);
  parent.postMessage({ lawcheckHero: most }, '*');
}

const seekTo = query.get('t');
if (seekTo !== null) window.heroSeek(Number(seekTo));
else if (matchMedia('(prefers-reduced-motion: reduce)').matches) { paused = true; pausedAt = LENGTH - 0.5; button(false); render(pausedAt); }
else requestAnimationFrame(frame);

if (embedded) {
  let waiting;
  document.fonts.ready.then(tell);
  addEventListener('resize', () => { clearTimeout(waiting); waiting = setTimeout(tell, 150); });
  addEventListener('message', (event) => { if (event.source === parent && event.data && event.data.lawcheckHeroAsk) tell(); });
}
</script>
